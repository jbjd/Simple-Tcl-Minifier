name: Tag

on:
  push:
    branches:
      - main
    paths:
      - version.txt
  workflow_dispatch:

permissions:
    contents: write

jobs:
  tag:
    name: Create Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: version.txt

      - name: Create Tag
        run: |
          version=v$(cat version.txt | tr -d '\n')
          git tag $version
          git push origin $version
